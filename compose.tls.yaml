# HTTPS overlay: DefectDojo's own nginx terminates TLS with a Let's Encrypt certificate.
#
# Enable in .env (compose reads COMPOSE_FILE from there, so every command picks it up):
#   COMPOSE_FILE=compose.yaml:compose.tls.yaml
#   DD_DOMAIN=defectdojo.example.com     # public DNS name pointing at this host
#   LETSENCRYPT_EMAIL=you@example.com    # optional
#
# Requirements: DD_DOMAIN resolves to this host and ports 80 + 443 are reachable from the
# internet (HTTP-01 challenge). Plain HTTP on :80 only answers the challenge and redirects.
#
#   host :80  -> nginx 8080  ACME challenge + 301 to https
#   host :443 -> nginx 8443  DefectDojo over TLS
#   certbot                  issues/renews every 12 h; nginx reloads on a new cert
#
# Importers talk to https://DD_DOMAIN:8443: nginx carries DD_DOMAIN as a network alias,
# so the name resolves to it inside the stack and the certificate verifies end to end.
---
x-dd-tls-env: &dd-tls-env
  DD_SITE_URL: https://${DD_DOMAIN:?set DD_DOMAIN in .env}
  DD_CSRF_TRUSTED_ORIGINS: https://${DD_DOMAIN}
  DD_SESSION_COOKIE_SECURE: "True"
  DD_CSRF_COOKIE_SECURE: "True"

x-importer-tls: &importer-tls
  environment:
    DD_URL: https://${DD_DOMAIN}:8443

services:
  uwsgi:
    environment: *dd-tls-env
  celeryworker:
    environment: *dd-tls-env
  celerybeat:
    environment: *dd-tls-env

  nginx:
    entrypoint: ["/bin/sh", "/entrypoint-letsencrypt.sh"]
    environment:
      DD_DOMAIN: ${DD_DOMAIN}
    volumes:
      - ./nginx/entrypoint-letsencrypt.sh:/entrypoint-letsencrypt.sh:ro
      - ./nginx/nginx-letsencrypt.conf:/etc/nginx/letsencrypt.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme_webroot:/var/www/acme:ro
    ports: !override
      - "${DD_HTTP_PORT:-80}:8080"
      - "${DD_HTTPS_PORT:-443}:8443"
    healthcheck:
      # /login on :8080 now redirects to https; this path is proxied to uwsgi for 127.0.0.1 only
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/uwsgi_health || exit 1"]
    networks:
      default:
        aliases: ["${DD_DOMAIN}"]

  certbot:
    image: certbot/certbot:${CERTBOT_VERSION:-latest}
    depends_on:
      nginx:
        condition: service_started
    entrypoint: ["/bin/sh", "/certbot-loop.sh"]
    environment:
      DD_DOMAIN: ${DD_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-false}
    volumes:
      - ./certbot/certbot-loop.sh:/certbot-loop.sh:ro
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/acme
    restart: unless-stopped

  import-semgrep: *importer-tls
  import-trivy: *importer-tls
  import-sonarqube: *importer-tls
  import-zap: *importer-tls
  import-zap-api: *importer-tls
  import-zap-full: *importer-tls

volumes:
  letsencrypt: {}
  acme_webroot: {}
